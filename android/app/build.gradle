plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingProperty = { String envName, String propertyName ->
    System.getenv(envName) ?: keystoreProperties[propertyName] ?: keystoreProperties[envName]
}

def releaseStoreFile = signingProperty('ANDROID_KEYSTORE_FILE', 'storeFile')
def releaseStorePassword = signingProperty('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingProperty('ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingProperty('ANDROID_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigningProperties = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it }
def releaseKeystoreFile = releaseStoreFile ? rootProject.file(releaseStoreFile) : null
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

if (releaseBuildRequested && !hasReleaseSigningProperties) {
    throw new RuntimeException(
        'Release signing is not configured. Set ANDROID_KEYSTORE_FILE, '
        + 'ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and '
        + 'ANDROID_KEY_PASSWORD, or create android/key.properties.'
    )
}

if (releaseBuildRequested && !releaseKeystoreFile.exists()) {
    throw new RuntimeException(
        "Release keystore was not found at ${releaseKeystoreFile}."
    )
}

android {
    namespace = "com.blockNote.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            storeFile releaseKeystoreFile
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    defaultConfig {
        applicationId = "com.blockNote.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
